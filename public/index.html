<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANEZ OS - WhatsApp Bot Dashboard</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .dashboard-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5);
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .stat-box {
            background: #21262d;
            border: 1px solid #30363d;
            border-radius: 8px;
            padding: 12px;
            text-align: center;
        }

        .stat-value {
            font-size: 1.2rem;
            font-weight: bold;
            color: #58a6ff;
            margin-bottom: 4px;
        }

        .stat-label {
            font-size: 0.75rem;
            color: #8b949e;
        }

        .form-section {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .input-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: #8b949e;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .input-group input {
            width: 100%;
            padding: 12px;
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 6px;
            color: #ffffff;
            font-size: 1rem;
            outline: none;
        }

        .input-group input:focus {
            border-color: #58a6ff;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: #1f6feb;
            color: #ffffff;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .btn-submit:hover {
            background: #388bfd;
        }

        .code-box {
            border: 2px dashed #30363d;
            border-radius: 8px;
            padding: 16px;
            text-align: center;
            background: #0d1117;
            margin-top: 16px;
            position: relative;
        }

        .code-display {
            font-family: monospace;
            font-size: 1.5rem;
            letter-spacing: 4px;
            color: #58a6ff;
            min-height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-copy {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: #21262d;
            border: 1px solid #30363d;
            color: #c9d1d9;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 12px;
            font-size: 0.75rem;
            background: rgba(238, 75, 43, 0.2);
            color: #ff7b72;
            margin-top: 16px;
            text-align: center;
            width: 100%;
        }

        .status-badge.connected {
            background: rgba(46, 160, 67, 0.2);
            color: #3fb950;
        }
    </style>
</head>
<body>

    <div class="dashboard-card">
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-value">500+</div>
                <div class="stat-label">Commands</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="session-count">0</div>
                <div class="stat-label">Sessions</div>
            </div>
            <div class="stat-box">
                <div class="stat-value" id="uptime-display">0m</div>
                <div class="stat-label">Uptime</div>
            </div>
        </div>

        <div class="form-section">
            <div class="input-group">
                <label for="phone">TARGET PHONE NUMBER</label>
                <input type="text" id="phone" placeholder="e.g. 233597789459" value="233597789459">
            </div>

            <button class="btn-submit" id="btn-generate">Generate Pairing Code</button>

            <div class="code-box">
                <span class="stat-label" style="display: block; margin-bottom: 6px;">PAIRING CODE</span>
                <div class="code-display" id="pairing-code">• • • • - • • • •</div>
                <button class="btn-copy" id="btn-copy">Copy</button>
            </div>
        </div>

        <div class="status-badge" id="status-badge">Status: Offline</div>
    </div>

    <!-- Include Socket.io client script -->
    <script src="/socket.io/socket.io.js"></script>
    <script>
        const socket = io();

        const phoneInput = document.getElementById('phone');
        const generateBtn = document.getElementById('btn-generate');
        const codeDisplay = document.getElementById('pairing-code');
        const copyBtn = document.getElementById('btn-copy');
        const statusBadge = document.getElementById('status-badge');
        const uptimeDisplay = document.getElementById('uptime-display');

        // Uptime counter
        let seconds = 0;
        setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const hrs = Math.floor(mins / 60);
            uptimeDisplay.innerText = `${hrs}h ${mins % 60}m ${seconds % 60}s`;
        }, 1000);

        // Send number to socket on click
        generateBtn.addEventListener('click', () => {
            const phoneNum = phoneInput.value.replace(/[^0-9]/g, '');
            if (!phoneNum) {
                alert('Please enter a valid phone number');
                return;
            }
            codeDisplay.innerText = 'GENERATING...';
            socket.emit('get_pairing_code', phoneNum);
        });

        // Receive pairing code from backend
        socket.on('pairing_code', (code) => {
            // Formats 8 character code into XXXX-XXXX
            const formatted = code.length === 8 ? `${code.slice(0, 4)}-${code.slice(4)}` : code;
            codeDisplay.innerText = formatted;
        });

        // Handle errors
        socket.on('pairing_error', (err) => {
            alert('Error: ' + err);
            codeDisplay.innerText = 'FAILED';
        });

        // Status listener
        socket.on('status', (status) => {
            statusBadge.innerText = `Status: ${status}`;
            if (status === 'Connected') {
                statusBadge.classList.add('connected');
            } else {
                statusBadge.classList.remove('connected');
            }
        });

        // Copy button
        copyBtn.addEventListener('click', () => {
            const codeText = codeDisplay.innerText.replace('-', '').trim();
            if (codeText && !codeText.includes('•') && codeText !== 'GENERATING...') {
                navigator.clipboard.writeText(codeText);
                copyBtn.innerText = 'Copied!';
                setTimeout(() => copyBtn.innerText = 'Copy', 2000);
            }
        });
    </script>
</body>
    </html>
