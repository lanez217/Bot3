<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANEZ OS - Pairing</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: monospace; background: #0f172a; color: #fff; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .card { background: #1e293b; padding: 25px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; border: 1px solid #334155; }
        input { width: 100%; padding: 12px; margin: 12px 0; border-radius: 4px; border: 1px solid #475569; background: #0f172a; color: #fff; box-sizing: border-box; text-align: center; font-size: 16px; }
        button { width: 100%; padding: 12px; background: #22c55e; border: none; color: #fff; font-weight: bold; border-radius: 4px; cursor: pointer; font-size: 16px; }
        .code { font-size: 26px; font-weight: bold; color: #4ade80; letter-spacing: 4px; margin-top: 15px; }
        .status { margin-top: 12px; color: #94a3b8; font-size: 13px; }
    </style>
</head>
<body>
    <div class="card">
        <h2>LANEZ OS PAIRING</h2>
        <input type="text" id="phone" placeholder="e.g. 233xxxxxxxx">
        <button onclick="getCode()">Get Pairing Code</button>
        <div id="codeDisplay" class="code"></div>
        <div id="statusDisplay" class="status">Status: Waiting...</div>
    </div>

    <script>
        const socket = io();

        socket.on('status', (msg) => {
            document.getElementById('statusDisplay').innerText = `Status: ${msg}`;
        });

        socket.on('pairing_code', (code) => {
            document.getElementById('codeDisplay').innerText = code;
            document.getElementById('statusDisplay').innerText = "Status: Enter code in WhatsApp!";
        });

        socket.on('pairing_error', (err) => {
            document.getElementById('statusDisplay').innerText = `Error: ${err}`;
        });

        function getCode() {
            const phone = document.getElementById('phone').value.trim();
            if (!phone) return alert('Enter phone number with country code!');
            document.getElementById('statusDisplay').innerText = "Status: Requesting code...";
            document.getElementById('codeDisplay').innerText = "";
            socket.emit('get_pairing_code', phone);
        }
    </script>
</body>
</html>
