<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>View Once unlock 🔓</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;700;800&display=swap');
* { font-family:'Inter',sans-serif; box-sizing:border-box; }
body {
  background:#050a0f;
  background: radial-gradient(circle at center, #1a2f35 0%, #0b141a 55%, #050a0f 100%);
  color:#e9edef; margin:0; min-height:100vh;
  display:flex; justify-content:center; align-items:center;
  overflow:hidden;
}
.flash-overlay {
  position:fixed; inset:0; background:white; opacity:0;
  pointer-events:none; z-index:99;
}
.flash-overlay.active { animation: flash .6s ease-out; }
@keyframes flash {
  0%{opacity:0} 15%{opacity:1} 100%{opacity:0}
}

.card {
  position:relative; z-index:2;
  background: rgba(22,33,40,.9);
  backdrop-filter: blur(24px);
  width:92%; max-width:400px;
  padding:32px; border-radius:28px;
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  text-align:center;
  animation: slideUp .8s cubic-bezier(.16,1,.3,1);
}
@keyframes slideUp { from{opacity:0; transform:translateY(50px)} to{opacity:1; transform:translateY(0)} }

.lens {
  width:72px; height:72px; margin:0 auto 12px;
  background: radial-gradient(circle at 30% 30%, #3a4d55, #111b21);
  border-radius:50%; border:3px solid #00a884;
  display:grid; place-items:center; font-size:32px;
  box-shadow:0 0 0 8px rgba(0,168,132,.12), 0 0 40px rgba(0,168,132,.3);
  animation: lensPulse 2s infinite;
}
@keyframes lensPulse { 0%,100%{box-shadow:0 0 0 8px rgba(0,168,132,.12), 0 0 40px rgba(0,168,132,.3)} 50%{box-shadow:0 0 0 14px rgba(0,168,132,.08), 0 0 60px rgba(0,168,132,.5)} }

h2 { margin:8px 0 4px; font-weight:800; font-size:22px; letter-spacing:-0.5px; }
.sub { color:#8696a0; font-size:12px; letter-spacing:2px; text-transform:uppercase; margin-bottom:22px; }

.stats { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin-bottom:22px; }
.stat { background:#0d171d; border-radius:14px; padding:12px 6px; border:1px solid rgba(255,255,255,.05); }
.stat b { display:block; font-size:14px; color:#00a884; }
.stat span { font-size:10px; color:#5a6b75; text-transform:uppercase; letter-spacing:1px; }

input { width:100%; background:#0d171d; border:1px solid rgba(255,255,255,.08); padding:16px; border-radius:16px; color:white; font-size:15px; outline:none; transition:.3s; }
input:focus { border-color:#00a884; box-shadow:0 0 0 4px rgba(0,168,132,.15); }

button { width:100%; margin-top:14px; background:#00a884; border:none; padding:16px; border-radius:16px; color:white; font-weight:800; font-size:15px; cursor:pointer; transition:.2s; position:relative; overflow:hidden; }
button::before { content:''; position:absolute; inset:0; background:linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent); transform:translateX(-100%); transition:.6s; }
button:hover::before { transform:translateX(100%); }
button:hover { transform:translateY(-2px); box-shadow:0 12px 24px rgba(0,168,132,.4); }
button:active { transform:scale(.97); }

.code-box { margin-top:18px; background:#050a0f; padding:22px; border-radius:16px; font-size:28px; letter-spacing:6px; font-weight:800; display:none; border:1px dashed #00a884; color:#00a884; cursor:pointer; }
.shutter { animation: shutter .5s cubic-bezier(.16,1,.3,1); }
@keyframes shutter { 0%{transform:scale(.5) rotate(-5deg); opacity:0} 60%{transform:scale(1.05)} 100%{transform:scale(1); opacity:1} }

.footer { margin-top:24px; font-size:11px; color:#4a5a65; line-height:1.6; }
.footer b { color:#8aa0ad; }
</style>
</head>
<body>
<div id="flash" class="flash-overlay"></div>

<div class="card">
  <div class="lens">📸</div>
  <h2>View Once unlock 🔓</h2>
  <div class="sub">Secure Pairing • Encrypted</div>

  <div class="stats">
    <div class="stat"><b id="servers">--</b><span>Nodes</span></div>
    <div class="stat"><b id="uptime">--</b><span>Uptime</span></div>
    <div class="stat"><b id="speed">--</b><span>Ping</span></div>
  </div>

  <input id="num" placeholder="e.g. 23359..." type="number" />
  <button id="btn" onclick="getCode()">Unlock Pair Code</button>
  <div id="code" class="code-box" onclick="copyCode()"></div>

  <div class="footer">
    Crafted with 🖤 by <b>Lanez XMD</b><br>
    © 2026 Lanez Team — All Rights Reserved
  </div>
</div>

<audio id="shutterSound" preload="auto">
  <source src="https://cdn.pixabay.com/download/audio/2022/03/24/audio_d1718ab41b.mp3" type="audio/mpeg">
</audio>

<script>
async function loadStats(){
  try{
    const startTime = performance.now();
    const r = await fetch('/api/stats').then(x=>x.json()).catch(()=>null);
    const latency = Math.round(performance.now() - startTime);
    
    if(r){
      document.getElementById('servers').innerText = r.servers;
      document.getElementById('uptime').innerText = r.uptime;
      document.getElementById('speed').innerText = latency + 'ms';
    } else {
      document.getElementById('servers').innerText = 'Offline';
      document.getElementById('uptime').innerText = '0m';
      document.getElementById('speed').innerText = '--';
    }
  }catch{}
}

function triggerFlash(){
  const flash = document.getElementById('flash');
  const sound = document.getElementById('shutterSound');
  flash.classList.remove('active');
  void flash.offsetWidth;
  flash.classList.add('active');
  sound.currentTime = 0;
  sound.play().catch(()=>{});
  if(navigator.vibrate) navigator.vibrate(80);
}

async function getCode(){
  const num = document.getElementById('num').value;
  const codeEl = document.getElementById('code');
  const btn = document.getElementById('btn');
  if(!num) return alert('Please enter your phone number');

  triggerFlash();
  btn.innerText = 'Capturing...';
  btn.disabled = true;

  try{
    const resp = await fetch('/pair', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ number: num })
    }).then(r => r.json());

    if(resp.code) {
      codeEl.innerText = resp.code;
      codeEl.style.display = 'block';
      codeEl.classList.remove('shutter');
      void codeEl.offsetWidth;
      codeEl.classList.add('shutter');
      
      navigator.clipboard.writeText(resp.code.replace(/-/g, ''));
      btn.innerText = 'COPIED TO CLIPBOARD ✅';
      setTimeout(() => { btn.innerText = 'Unlock Pair Code'; btn.disabled = false; }, 3000);
    } else {
      alert(resp.error || 'Failed to get code');
      btn.innerText = 'Unlock Pair Code';
      btn.disabled = false;
    }
  }catch(err){
    alert('Server connection error. Please try again.');
    btn.innerText = 'Unlock Pair Code';
    btn.disabled = false;
  }
}

function copyCode(){
  const codeText = document.getElementById('code').innerText.replace(/-/g, '');
  if(!codeText) return;
  navigator.clipboard.writeText(codeText);
  const orig = document.getElementById('code').innerText;
  document.getElementById('code').innerText = 'COPIED!';
  setTimeout(() => document.getElementById('code').innerText = orig, 1000);
  if(navigator.vibrate) navigator.vibrate(50);
}

loadStats();
setInterval(loadStats, 4000);
</script>
</body>
</html>
