<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LANEZ BOT CONTROL PANEL</title>
    <script src="/socket.io/socket.io.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --bg: #0b0f19; --card: #151c2c; --primary: #00e676; --accent: #7c4dff; --text: #ffffff; --subtext: #94a3b8; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: var(--card); border-radius: 16px; padding: 25px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); border: 1px solid rgba(255,255,255,0.05); }
        .header { text-align: center; margin-bottom: 20px; }
        .header h1 { margin: 0; font-size: 24px; color: var(--primary); letter-spacing: 1px; }
        .header p { margin: 5px 0 0; color: var(--subtext); font-size: 13px; }
        .badge { display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; background: rgba(0,230,118,0.1); color: var(--primary); margin-top: 10px; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 20px 0; }
        .stat-card { background: rgba(0,0,0,0.2); padding: 12px; border-radius: 10px; text-align: center; border: 1px solid rgba(255,255,255,0.02); }
        .stat-card h3 { margin: 0; font-size: 18px; color: var(--accent); }
        .stat-card span { font-size: 11px; color: var(--subtext); }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 12px; color: var(--subtext); margin-bottom: 5px; }
        input { width: 100%; padding: 12px; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; box-sizing: border-box; font-size: 14px; outline: none; }
        input:focus { border-color: var(--primary); }
        button { width: 100%; padding: 12px; background: linear-gradient(135deg, var(--primary), #00b0ff); border: none; border-radius: 8px; color: #000; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 14px; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        .code-box { font-size: 28px; letter-spacing: 6px; font-weight: 700; color: var(--primary); text-align: center; margin: 15px 0; padding: 10px; background: rgba(0,0,0,0.4); border-radius: 8px; min-height: 40px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>⚡ LANEZ BOT OS ⚡</h1>
            <p>Runner SLENZ Control Dashboard</p>
            <div id="status" class="badge">Status: Offline</div>
        </div>

        <div class="stats-grid">
            <div class="stat-card">
                <h3 id="cmd-count">500+</h3>
                <span>Loaded Commands</span>
            </div>
            <div class="stat-card">
                <h3 id="uptime">0s</h3>
                <span>Server Uptime</span>
            </div>
        </div>

        <div class="form-group">
            <label>WhatsApp Phone Number (with Country Code)</label>
            <input type="text" id="phone" placeholder="e.g. 233xxxxxxxx">
        </div>
        <button onclick="requestPairing()">Link New Device</button>

        <div class="code-box" id="pairing-code">------</div>
    </div>

    <script>
        const socket = io();
        socket.on('status', (msg) => document.getElementById('status').innerText = msg);
        socket.on('pairing_code', (code) => document.getElementById('pairing-code').innerText = code);
        socket.on('connected', () => document.getElementById('status').innerText = 'Connected & Active');

        function requestPairing() {
            const phone = document.getElementById('phone').value;
            if(!phone) return alert('Please enter your phone number!');
            socket.emit('start_bot', { phone });
        }

        setInterval(() => {
            const uptime = document.getElementById('uptime');
            let secs = parseInt(uptime.getAttribute('data-sec') || 0) + 1;
            uptime.setAttribute('data-sec', secs);
            uptime.innerText = secs + 's';
        }, 1000);
    </script>
</body>
</html>
