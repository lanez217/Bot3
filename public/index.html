<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LANEZ OS - Pairing</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Outfit',sans-serif;-webkit-tap-highlight-color:transparent}
body{background:#07070B;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;position:relative}
body.shake{animation:shake 0.4s ease-in-out}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
body::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,#8A2BE2 0%,transparent 70%);top:-200px;left:-200px;filter:blur(80px);opacity:0.5;animation:float 6s infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(30px)}}
.card{width:95%;max-width:420px;background:rgba(255,255,255,0.05);backdrop-filter:blur(25px);border:1px solid rgba(255,255,255,0.1);border-radius:28px;padding:30px;z-index:2;box-shadow:0 20px 60px rgba(0,0,0,0.5)}

/* SCANNER RUN EFFECT */
.scanner{position:fixed;top:0;left:0;width:100%;height:4px;background:linear-gradient(90deg,transparent,#8A2BE2,#FF00FF,transparent);box-shadow:0 0 20px #8A2BE2, 0 0 40px #FF00FF;z-index:100;display:none;animation:scanMove 1.8s ease-in-out}
@keyframes scanMove{0%{top:0}50%{top:100%}100%{top:0}}
.scan-overlay{position:fixed;inset:0;background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(138,43,226,0.03) 2px,rgba(138,43,226,0.03) 4px);z-index:99;display:none;pointer-events:none}
.scan-overlay.active{display:block;animation:flicker 0.1s infinite}
@keyframes flicker{0%{opacity:0.5}50%{opacity:1}}

.logo-wrap{perspective:1000px;width:70px;height:70px;margin:0 auto 15px}
.logo{width:100%;height:100%;background:linear-gradient(135deg,#8A2BE2,#FF00FF);border-radius:18px;display:flex;align-items:center;justify-content:center;font-size:32px;box-shadow:0 10px 30px rgba(138,43,226,0.5);cursor:pointer;transform-style:preserve-3d;transition:transform 0.7s cubic-bezier(0.68,-0.55,0.265,1.55)}
.logo.flip{transform:rotateY(360deg) scale(1.15)}
h1{text-align:center;font-weight:800;letter-spacing:1px;font-size:26px}
.subtitle{text-align:center;opacity:0.6;font-size:13px;margin:5px 0 20px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:15px 0}
.stat-wrap{perspective:1000px;cursor:pointer}
.stat{position:relative;background:rgba(255,255,255,0.06);border-radius:14px;padding:12px;text-align:center;border:1px solid rgba(255,255,255,0.05);transform-style:preserve-3d;transition:transform 0.6s cubic-bezier(0.175,0.885,0.32,1.275);height:58px}
.stat.flipped{transform:rotateY(180deg)}
.stat-front,.stat-back{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;backface-visibility:hidden;border-radius:14px}
.stat-back{transform:rotateY(180deg);background:linear-gradient(135deg,#8A2BE2,#FF00FF);font-size:11px;font-weight:700}
.stat span{font-size:11px;opacity:0.5} .stat b{font-size:13px;color:#C084FC}
.stat.flipped b{color:#fff}
input{width:100%;padding:16px 18px;border-radius:14px;border:1px solid rgba(255,255,255,0.1);background:rgba(0,0,0,0.4);color:#fff;outline:none;font-size:15px;margin-top:10px;transition:0.3s}
input:focus{border-color:#8A2BE2;box-shadow:0 0 20px rgba(138,43,226,0.3)}
.btn{width:100%;padding:16px;margin-top:14px;border:none;border-radius:14px;background:linear-gradient(135deg,#8A2BE2,#FF00FF);color:#fff;font-weight:700;font-size:16px;cursor:pointer;transition:all 0.4s cubic-bezier(0.68,-0.55,0.265,1.55);position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;gap:8px}
.btn.generating{animation:btnPulse 1s infinite;pointer-events:none}
@keyframes btnPulse{0%,100%{transform:scale(1)}50%{transform:scale(0.98)}}
.spinner{width:18px;height:18px;border:2px solid rgba(255,255,255,0.3);border-top-color:#fff;border-radius:50%;animation:spin 0.8s linear infinite;display:none}
.btn.generating .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.progress-wrap{height:4px;background:rgba(255,255,255,0.1);border-radius:10px;margin-top:12px;overflow:hidden;display:none}
.progress{height:100%;width:0%;background:linear-gradient(90deg,#8A2BE2,#FF00FF);transition:width 0.1s}
.codeBox{margin-top:20px;background:#000;border-radius:14px;padding:18px;text-align:center;border:1px dashed #8A2BE2;display:none}
.codeBox.show{display:block;animation:pop 0.5s cubic-bezier(0.68,-0.55,0.265,1.55)}
@keyframes pop{0%{transform:scale(0.5) rotateX(-90deg);opacity:0}100%{transform:scale(1) rotateX(0);opacity:1}}
.code{font-size:28px;letter-spacing:6px;font-weight:800;color:#FF00FF;cursor:pointer}
.footer{text-align:center;margin-top:22px;font-size:11px;opacity:0.4;letter-spacing:2px}
</style>
</head>
<body>
<div class="scanner" id="scanner"></div>
<div class="scan-overlay" id="overlay"></div>

<div class="card">
    <div class="logo-wrap" onclick="flipLogo(this)"><div class="logo" id="logo">⚡</div></div>
    <h1>LANEZ OS PRO</h1>
    <p class="subtitle">Elite WhatsApp Pairing System</p>
    <div class="stats">
        <div class="stat-wrap" onclick="flipCard(this)"><div class="stat"><div class="stat-front"><span>STATUS</span><b id="status">Online 🟢</b></div><div class="stat-back">SERVER ACTIVE</div></div></div>
        <div class="stat-wrap" onclick="flipCard(this)"><div class="stat"><div class="stat-front"><span>UPTIME</span><b id="uptime">0h 0m 0s</b></div><div class="stat-back">LANEZ OS V2</div></div></div>
        <div class="stat-wrap" onclick="flipCard(this)"><div class="stat"><div class="stat-front"><span>DATE</span><b id="date">--</b></div><div class="stat-back" id="season">WINTER ❄️</div></div></div>
        <div class="stat-wrap" onclick="flipCard(this)"><div class="stat"><div class="stat-front"><span>TIME</span><b id="time">--</b></div><div class="stat-back">GHANA 🇬🇭</div></div></div>
    </div>
    <input id="num" placeholder="Enter Number e.g 23359..." type="number">
    <button class="btn" id="genBtn" onclick="pair()"><div class="spinner"></div><span id="btnText">GENERATE PAIR CODE</span></button>
    <div class="progress-wrap" id="progWrap"><div class="progress" id="prog"></div></div>
    <div id="box" class="codeBox">
        <span style="font-size:12px;opacity:0.6">YOUR PAIR CODE - TAP TO COPY</span>
        <div class="code" id="code" onclick="copyCode()">----</div>
        <p style="font-size:11px;margin-top:8px;opacity:0.6">WhatsApp > Linked Devices > Link with phone number</p>
    </div>
    <div class="footer">POWERED BY LANEZ © 2026</div>
</div>

<script>
function flipLogo(el){let l=el.querySelector('.logo');l.classList.remove('flip');void l.offsetWidth;l.classList.add('flip');if(navigator.vibrate)navigator.vibrate(50)}
function flipCard(w){w.querySelector('.stat').classList.toggle('flipped');if(navigator.vibrate)navigator.vibrate(30)}
async function updateInfo(){
    try{let r=await fetch('/api/uptime').then(res=>res.json());document.getElementById('uptime').innerText=r.uptime}catch{}
    setInterval(async()=>{try{let r=await fetch('/api/uptime').then(res=>res.json());document.getElementById('uptime').innerText=r.uptime}catch{}},1000);
    setInterval(()=>{let n=new Date();document.getElementById('date').innerText=n.toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});document.getElementById('time').innerText=n.toLocaleTimeString();let m=n.getMonth();document.getElementById('season').innerText=m<2||m==11?'WINTER ❄️':m<5?'SPRING 🌸':m<8?'SUMMER ☀️':'AUTUMN 🍂'},1000);
}
updateInfo();

function runScreenEffect(){
    document.body.classList.add('shake');
    document.getElementById('scanner').style.display='block';
    document.getElementById('overlay').classList.add('active');
    document.getElementById('progWrap').style.display='block';
    let p=0;
    let interval=setInterval(()=>{p+=Math.random()*15;if(p>100)p=100;document.getElementById('prog').style.width=p+'%';if(p>=100)clearInterval(interval)},120);
    setTimeout(()=>{document.body.classList.remove('shake');document.getElementById('scanner').style.display='none';document.getElementById('overlay').classList.remove('active')},1800);
}

async function pair(){
    let number=document.getElementById('num').value;
    if(!number) return alert('Enter number');
    let btn=document.getElementById('genBtn'),txt=document.getElementById('btnText');
    btn.classList.add('generating');txt.innerText='GENERATING...';
    runScreenEffect();

    await new Promise(r=>setTimeout(r,1900));

    try{
        let res=await fetch('/pair',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({number})}).then(r=>r.json());
        btn.classList.remove('generating');txt.innerText='GENERATE PAIR CODE';document.getElementById('progWrap').style.display='none';document.getElementById('prog').style.width='0%';
        if(res.code){
            let box=document.getElementById('box');box.classList.remove('show');void box.offsetWidth;box.classList.add('show');box.style.display='block';
            document.getElementById('code').innerText=res.code;
            navigator.clipboard.writeText(res.code.replace(/-/g,''));
            txt.innerText='COPIED TO CLIPBOARD ✅';
            setTimeout(()=>txt.innerText='GENERATE PAIR CODE',2000);
            if(navigator.vibrate)navigator.vibrate([100,50,200]);
        }else alert(res.error);
    }catch(e){btn.classList.remove('generating');txt.innerText='GENERATE PAIR CODE';alert('Error, try again')}
}

function copyCode(){
    let c=document.getElementById('code').innerText.replace(/-/g,'');
    navigator.clipboard.writeText(c);
    let orig=document.getElementById('code').innerText;
    document.getElementById('code').innerText='COPIED!';
    setTimeout(()=>document.getElementById('code').innerText=orig,1000);
    if(navigator.vibrate)navigator.vibrate(50);
}
</script>
</body>
</html>
