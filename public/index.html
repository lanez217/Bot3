<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Runner SLENZ Control Panel</title>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; width: 90%; max-width: 400px; text-align: center; }
        input, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 5px; border: none; box-sizing: border-box; }
        button { background: #25d366; color: #fff; font-weight: bold; cursor: pointer; }
        #code { font-size: 24px; letter-spacing: 4px; color: #25d366; margin: 15px 0; font-weight: bold; }
    </style>
</head>
<body>
    <div class="card">
        <h2>⚡ Runner SLENZ ⚡</h2>
        <p id="status">Status: Disconnected</p>
        <input type="text" id="phone" placeholder="Phone Number (e.g., 233xxxxxxxx)">
        <button onclick="connectBot()">Generate Pairing Code</button>
        <div id="code"></div>
    </div>

    <script>
        const socket = io();
        socket.on('status', (msg) => document.getElementById('status').innerText = msg);
        socket.on('pairing_code', (code) => document.getElementById('code').innerText = code);

        function connectBot() {
            const phone = document.getElementById('phone').value;
            socket.emit('start_bot', { phone });
        }
    </script>
</body>
                              </html>
